name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta cada 4 horas automáticamente (a las 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub Actions

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Ping and Auto-Wake Streamlit App
        run: |
          python src/utils/keep_alive.py
